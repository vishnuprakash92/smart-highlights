openapi: 3.0.0
info:
  title: Smart Highlights Analysis API (contract)
  version: 1.0.0
paths:
  /analyze:
    post:
      summary: Analyze highlighted text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                mode:
                  type: string
                  enum: [summary, explanation, translation]
                model:
                  type: string
              required: [text]
      responses:
        '200':
          description: Successful analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                  explanation:
                    type: string
                  translation:
                    type: string
                  modelUsed:
                    type: string
                  latencyMs:
                    type: integer
        '400':
          description: Bad request
        '500':
          description: Server error
